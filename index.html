<!DOCTYPE html>  
<html lang="en">  
<head>  
<meta charset="UTF-8">  
<meta name="viewport" content="width=device-width, initial-scale=1.0">  
<title>Confession Box</title>  
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>  
<style>  
:root {  
    --primary:#ff4b5c;  
    --bg:linear-gradient(135deg,#fff5f6,#ffe3e6);  
}  
  
body {  
    font-family:'Segoe UI',system-ui;  
    background:var(--bg);  
    margin:0;  
    display:flex;  
    justify-content:center;  
    align-items:center;  
    height:100vh;  
    overflow: hidden;
}  
  
.card {  
    background:rgba(255,255,255,0.9);  
    backdrop-filter:blur(15px);  
    padding:20px;  
    border-radius:18px;  
    width:100%;  
    max-width:380px;  
    text-align:center;  
    box-shadow:0 10px 30px rgba(0,0,0,0.1);  
    box-sizing: border-box;
}  
  
.fullscreen {  
    position:fixed;  
    top:0;  
    left:0;  
    width:100% !important;  
    height:100% !important;  
    max-width:none !important;  
    border-radius:0 !important;  
    padding:0 !important;  
    margin:0 !important;  
    z-index:5;  
    overflow:hidden;  
}  
  
input,select {  
    width:100%;  
    padding:12px;  
    margin:8px 0;  
    border-radius:10px;  
    border:1px solid #ffc4cb;  
    outline:none;  
    box-sizing: border-box;
}  
  
textarea {  
    width:100%;  
    padding:12px;  
    margin:8px 0;  
    border-radius:14px;  
    border:1px solid #ffc4cb;  
    outline:none;  
    height:120px;  
    resize:none;  
    font-size:16px;  
    box-sizing: border-box;
}  
  
textarea::placeholder {  
    font-size:18px;  
    color:#777;  
}  
  
button {  
    width:100%;  
    padding:12px;  
    background:var(--primary);  
    color:white;  
    border:none;  
    border-radius:10px;  
    font-weight:bold;  
    cursor:pointer;  
    box-sizing: border-box;
}  
  
.tabs {  
    position:fixed;  
    bottom:0;  
    left:0;  
    width:100%;  
    display:flex;  
    justify-content:space-around;  
    background:white;  
    padding:8px 0;  
    box-shadow:0 -4px 10px rgba(0,0,0,0.1);  
    z-index:20;  
}  
  
.tab {  
    text-align:center;  
    font-size:12px;  
    cursor:pointer;  
    flex: 1;
}  
.active { color:var(--primary); font-weight:bold; }  
  
.hidden { display:none; }  

/* Spring Popup Ticker Design (Optimized for New Post View flow) */
.fomo-ticker {
    font-size: 13px;
    color: #e91e63;
    text-align: center;
    background: #fff;
    border-radius: 20px;
    box-shadow: 0 4px 15px rgba(255, 75, 92, 0.1);
    border: 1px solid #ffe3e6;
    
    /* Transition base configurations */
    opacity: 0;
    transform: scale(0.8);
    max-height: 0;
    padding: 0;
    margin: 0 auto;
    overflow: hidden;
    transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    width: fit-content;
}

.fomo-ticker.visible {
    opacity: 1;
    transform: scale(1);
    max-height: 50px;
    padding: 6px 16px;
    margin: 10px auto 15px auto;
}

@keyframes pulseDot {
    0% { transform: scale(0.8); opacity: 0.5; }
    50% { transform: scale(1.2); opacity: 1; }
    100% { transform: scale(0.8); opacity: 0.5; }
}

.live-dot {
    height: 8px;
    width: 8px;
    background-color: #ff4b5c;
    border-radius: 50%;
    display: inline-block;
    margin-right: 5px;
    animation: pulseDot 1.8s infinite ease-in-out;
}

/* 🎬 ADDICTIVE SCROLL-SNAP NATIVE VERTICAL REELS ENGINE */
.reels-container {
    width: 100%;
    height: 100vh;
    background: #0f0c20;
    overflow-y: scroll;
    scroll-snap-type: y mandatory;
    box-sizing: border-box;
    scrollbar-width: none; /* Hide Firefox scrollbars */
}

.reels-container::-webkit-scrollbar {
    display: none; /* Hide Chrome/Safari scrollbars */
}

.reel-slide {
    width: 100%;
    height: 100vh;
    scroll-snap-align: start;
    scroll-snap-stop: always;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    position: relative;
    box-sizing: border-box;
    padding: 24px;
    padding-bottom: 110px; /* Preserve whitespace cushion for navigation bar */
}

.reel-card {
    width: 100%;
    max-width: 330px;
    text-align: center;
    color: white;
    z-index: 10;
}

.reel-meta {
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: rgba(255, 255, 255, 0.6);
    margin-bottom: 15px;
}

.reel-text {
    font-size: 24px;
    font-weight: 700;
    line-height: 1.45;
    text-shadow: 0 4px 12px rgba(0,0,0,0.5);
    word-break: break-word;
    overflow-wrap: anywhere;
    white-space: pre-wrap;
    max-height: 50vh;
    overflow-y: auto;
}

/* Floating Vertical Tray Control Trackers */
.reels-sidebar {
    position: absolute;
    right: 16px;
    bottom: 130px;
    display: flex;
    flex-direction: column;
    gap: 18px;
    z-index: 15;
    background: rgba(0, 0, 0, 0.35);
    padding: 14px 10px;
    border-radius: 30px;
    backdrop-filter: blur(8px);
    border: 1px solid rgba(255,255,255,0.1);
}

.reel-side-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    color: white;
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
}

.reel-side-icon {
    font-size: 26px;
    transition: transform 0.1s ease;
}

.reel-side-icon:active {
    transform: scale(1.3);
}

/* Dark variant configurations shifting tab navigation appearance inside reels view */
.tabs.reels-darkmode {
    background: rgba(15, 12, 32, 0.9) !important;
    backdrop-filter: blur(20px);
    box-shadow: 0 -4px 20px rgba(0,0,0,0.4) !important;
    border-top: 1px solid rgba(255,255,255,0.08);
}
.tabs.reels-darkmode .tab {
    color: rgba(255, 255, 255, 0.4);
}
.tabs.reels-darkmode .tab.active {
    color: var(--primary);
}
</style>  
</head>  
<body>  
<div class="card">  
<div id="registerView">  
    <h2>Create Profile</h2>  
    <input id="username" placeholder="Your Name">  
    <input id="userclass" placeholder="Class / Section">  
    <select id="usergender">  
        <option disabled selected>Select Gender</option>  
        <option>Male</option>  
        <option>Female</option>  
    </select>  
    <button onclick="saveProfile()">Create Profile</button>  
</div>  
<div id="confessionView" class="hidden">  
    <h2>Express Your Feelings ❤️</h2>  
    <div id="fomoTicker" class="fomo-ticker"></div>
    <textarea id="confessionMessage" placeholder="Write your secret confession here..."></textarea>  
    <button id="sendBtn" onclick="sendConfession()">Send Confession 🚀</button>  
    <p id="sendLabel"></p>
</div>  
<div id="profileView" class="hidden">  
    <h2>Your Profile</h2>  
    <p id="profileInfo"></p>  
    <button onclick="showEdit()">Edit</button>  
</div>  
<div id="editView" class="hidden">  
    <h2>Edit Profile</h2>  
    <input id="editName">  
    <input id="editClass">  
    <select id="editGender">  
        <option>Male</option>  
        <option>Female</option>  
    </select>  
    <button onclick="updateProfile()">Save</button>  
</div>  

<div id="reelsView" class="hidden">
    <div class="reels-container" id="reelsContainer"></div>
</div>

</div>  

<div class="tabs hidden" id="tabs">  
    <div class="tab" onclick="showTab('profile')">👤<br>You</div>  
    <div class="tab active" onclick="showTab('confession')">➕<br>New</div>  
    <div class="tab" onclick="showTab('reels')">🎬<br>Feeds</div>  
</div>  

<script>  
const SUPABASE_URL="https://gsckseffapurzqkexeup.supabase.co";  
const SUPABASE_ANON_KEY="sb_publishable_JWdBSaFEpNjTuKEHTcno5w_9hKO5Eu7";  
  
let supabaseClient;  

// High-contrast deep space gradient shifts for content backgrounds
const aestheticBackdropPalettes = [
    "linear-gradient(135deg, #0f0c20, #150019, #2b001d)",
    "linear-gradient(135deg, #0d1b2a, #1b263b, #415a77)",
    "linear-gradient(135deg, #1a051d, #03001e, #7303c0)",
    "linear-gradient(135deg, #111111, #461616, #1c0505)",
    "linear-gradient(135deg, #051923, #003566, #00669b)",
    "linear-gradient(135deg, #141e30, #243b55)",
    "linear-gradient(135deg, #2c3e50, #000000)"
];

// Target Elements
const viewRegister = document.getElementById('registerView');
const viewConfession = document.getElementById('confessionView');
const viewProfile = document.getElementById('profileView');
const viewEdit = document.getElementById('editView');
const viewReels = document.getElementById('reelsView');
const navigationTabs = document.getElementById('tabs');

const inputUsername = document.getElementById('username');
const inputUserclass = document.getElementById('userclass');
const selectUsergender = document.getElementById('usergender');

const inputEditName = document.getElementById('editName');
const inputEditClass = document.getElementById('editClass');
const selectEditGender = document.getElementById('editGender');

const labelProfileInfo = document.getElementById('profileInfo');
const txtConfessionMessage = document.getElementById('confessionMessage');
const labelSendLabel = document.getElementById('sendLabel');
  
// Boot State Controller Action Verification Logic
window.onload=()=>{  
    if(localStorage.getItem('sb_name')){  
        viewRegister.classList.add('hidden');  
        navigationTabs.classList.remove('hidden');  
        showTab('confession');  
    }  
};  
  
/* Profile processing workflows */  
function saveProfile(){  
    if(!inputUsername.value || !inputUserclass.value || selectUsergender.selectedIndex===0){  
        alert("Fill all fields");  
        return;  
    }  
  
    localStorage.setItem('sb_name', inputUsername.value);  
    localStorage.setItem('sb_class', inputUserclass.value);  
    localStorage.setItem('sb_gender', selectUsergender.value);  
  
    viewRegister.classList.add('hidden');  
    navigationTabs.classList.remove('hidden');  
    showTab('confession');  
}  
  
function loadProfile(){  
    labelProfileInfo.innerText =  
    `Name: ${localStorage.getItem('sb_name')}  
Class: ${localStorage.getItem('sb_class')}  
Gender: ${localStorage.getItem('sb_gender')}`;  
}  
  
/* Edit parameters mapping configurations */  
function showEdit(){  
    viewProfile.classList.add('hidden');  
    viewEdit.classList.remove('hidden');  
  
    inputEditName.value=localStorage.getItem('sb_name');  
    inputEditClass.value=localStorage.getItem('sb_class');  
    selectEditGender.value=localStorage.getItem('sb_gender');  
}  
  
function updateProfile(){  
    localStorage.setItem('sb_name', inputEditName.value);  
    localStorage.setItem('sb_class', inputEditClass.value);  
    localStorage.setItem('sb_gender', selectEditGender.value);  
  
    viewEdit.classList.add('hidden');  
    viewProfile.classList.remove('hidden');  
    loadProfile();  
}  
  
/* Router system view navigation engine switcher */  
function showTab(tab){  
    viewConfession.classList.add('hidden');  
    viewProfile.classList.add('hidden');  
    viewEdit.classList.add('hidden');  
    viewReels.classList.add('hidden');
  
    document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));  
    const mainCard = document.querySelector('.card');
    
    mainCard.classList.remove('fullscreen');  
    navigationTabs.classList.remove('reels-darkmode');

    if(tab==='profile'){  
        viewProfile.classList.remove('hidden');  
        loadProfile();  
        document.querySelectorAll('.tab')[0].classList.add('active');  
    }  
    if(tab==='confession'){  
        viewConfession.classList.remove('hidden');  
        updateFomoTicker();
        document.querySelectorAll('.tab')[1].classList.add('active');  
    }  
    if(tab==='reels'){
        viewReels.classList.remove('hidden');
        mainCard.classList.add('fullscreen');
        navigationTabs.classList.add('reels-darkmode');
        document.querySelectorAll('.tab')[2].classList.add('active');
        initiateReelsEngine();
    }
}  
  
/* Word filter validation parsing engine layout rules */  
async function sendConfession(){  
    const msg=txtConfessionMessage.value.trim();  
    const label=labelSendLabel;  
    const btn=document.getElementById("sendBtn");  
  
    const banned=["fuck","ass","randi","chod","chut","lund","gand","sex","bitch","slut"];  
  
    if(!msg){  
        alert("Type message");  
        return;  
    }  
  
    const lower=msg.toLowerCase();  
    for(let w of banned){  
        if(lower.includes(w)){  
            label.style.color="red";  
            label.innerText="Don't use abusive words.";  
            return;  
        }  
    }  
  
    label.style.color="#ff9800";  
    label.innerText="Sending...";  
    btn.disabled=true;  
  
    if(!supabaseClient){  
        supabaseClient=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);  
    }  
  
    const {error}=await supabaseClient.from('confessions').insert([{  
        name:localStorage.getItem('sb_name'),  
        class:localStorage.getItem('sb_class'),  
        gender:localStorage.getItem('sb_gender'),  
        message:msg  
    }]);  
  
    btn.disabled=false;  
  
    if(error){  
        label.style.color="red";  
        label.innerText="Error";  
    } else {  
        label.style.color="green";  
        label.innerText="Sent";  
        txtConfessionMessage.value="";  
    }  
}  

/* Live online activity mock logic calculations */
function updateFomoTicker() {
    const ticker = document.getElementById('fomoTicker');
    if (!ticker) return;

    ticker.classList.remove('visible');

    const currentHour = new Date().getHours();
    let min = 0, max = 0;

    if (currentHour >= 14 && currentHour < 20) { min = 9; max = 16; } 
    else if (currentHour >= 21 && currentHour < 22) { min = 3; max = 4; } 
    else if (currentHour >= 22 || currentHour < 8) { min = 0; max = 0; } 
    else if (currentHour >= 9 && currentHour < 13) { min = 5; max = 8; } 
    else {
        if (currentHour === 8 || currentHour === 20) { min = 3; max = 5; }
        else { min = 6; max = 8; }
    }

    const activeUsers = min === max ? min : Math.floor(Math.random() * (max - min + 1)) + min; 
    
    if (activeUsers === 0) return;

    ticker.innerHTML = `<span class="live-dot"></span> <b>${activeUsers} people are online</b>`;
    
    setTimeout(() => {
        ticker.classList.add('visible');
    }, 150);
}

/* 🎬 MULTI-PAGE SNAP REELS COMPILER */
async function initiateReelsEngine() {
    const container = document.getElementById('reelsContainer');
    container.innerHTML = "<p style='color:rgba(255,255,255,0.6); text-align:center; padding-top:45vh;'>Preparing Secrets Feed...</p>";

    if(!supabaseClient){  
        supabaseClient=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);  
    }

    const {data, error} = await supabaseClient
        .from('confessions')
        .select('*')
        .order('id', {ascending: false});

    if (error || !data || data.length === 0) {
        container.innerHTML = "<p style='color:white; text-align:center; padding-top:45vh;'>No secrets discovered inside the database pool yet.</p>";
        return;
    }

    // Shuffle data pool to deliver unpredictable content layout sequences
    const shuffledReels = data.sort(() => Math.random() - 0.5);
    container.innerHTML = "";

    const loveIds = getReactedIds('love');
    const fireIds = getReactedIds('fire');
    const laughIds = getReactedIds('laugh');

    shuffledReels.forEach((item, index) => {
        const gradientIndex = index % aestheticBackdropPalettes.length;
        const currentBackground = aestheticBackdropPalettes[gradientIndex];

        let profileTag = item.name === localStorage.getItem('sb_name') ? "YOU" : "ANONYMOUS";
        
        let isLove = loveIds.includes(item.id);
        let isFire = fireIds.includes(item.id);
        let isLaugh = laughIds.includes(item.id);

        let loveIcon = isLove ? "❤️" : "🤍";
        let fireOpacity = isFire ? "opacity: 1;" : "opacity: 0.4;";
        let laughOpacity = isLaugh ? "opacity: 1;" : "opacity: 0.4;";

        const slide = document.createElement('div');
        slide.className = 'reel-slide';
        slide.style.background = currentBackground;

        slide.innerHTML = `
            <div class="reel-card">
                <div class="reel-meta">🤫 From Class ${item.class} (${profileTag})</div>
                <div class="reel-text">${item.message}</div>
            </div>
            <div class="reels-sidebar">
                <div class="reel-side-item" onclick="executeReelReaction(${item.id}, 'love')">
                    <span class="reel-side-icon" id="reel-love-btn-${item.id}">${loveIcon}</span>
                    <span id="reel-love-count-${item.id}">${item.likes || 0}</span>
                </div>
                <div class="reel-side-item" onclick="executeReelReaction(${item.id}, 'fire')">
                    <span class="reel-side-icon" id="reel-fire-btn-${item.id}" style="${fireOpacity}">🔥</span>
                    <span id="reel-fire-count-${item.id}">${item.react_fire || 0}</span>
                </div>
                <div class="reel-side-item" onclick="executeReelReaction(${item.id}, 'laugh')">
                    <span class="reel-side-icon" id="reel-laugh-btn-${item.id}" style="${laughOpacity}">💀</span>
                    <span id="reel-laugh-count-${item.id}">${item.react_laugh || 0}</span>
                </div>
            </div>
        `;
        container.appendChild(slide);
    });
}

/* Local reaction process interfaces running dynamic database pipelines */
async function executeReelReaction(id, type) {
    await toggleReaction(id, type);

    const loveIds = getReactedIds('love');
    const fireIds = getReactedIds('fire');
    const laughIds = getReactedIds('laugh');

    const loveBtn = document.getElementById(`reel-love-btn-${id}`);
    const fireBtn = document.getElementById(`reel-fire-btn-${id}`);
    const laughBtn = document.getElementById(`reel-laugh-btn-${id}`);

    if(type === 'love' && loveBtn) loveBtn.innerHTML = loveIds.includes(id) ? "❤️" : "🤍";
    if(type === 'fire' && fireBtn) fireBtn.style.opacity = fireIds.includes(id) ? "1" : "0.4";
    if(type === 'laugh' && laughBtn) laughBtn.style.opacity = laughIds.includes(id) ? "1" : "0.4";
}

function getReactedIds(type) {
    let storageKey = type === 'love' ? 'sb_liked_confessions' : `sb_react_${type}`;
    try {
        return JSON.parse(localStorage.getItem(storageKey)) || [];
    } catch(e) {
        return [];
    }
}

async function toggleReaction(id, type) {
    let storageKey = type === 'love' ? 'sb_liked_confessions' : `sb_react_${type}`;
    let dbColumn = type === 'love' ? 'likes' : (type === 'fire' ? 'react_fire' : 'react_laugh');
    
    let activeIds = getReactedIds(type);
    const countSpan = document.getElementById(`reel-${type}-count-${id}`);
    let currentCount = countSpan ? (parseInt(countSpan.innerText) || 0) : 0;
    
    let hasReacted = activeIds.includes(id);
    let newCount = currentCount;

    if (hasReacted) {
        activeIds = activeIds.filter(activeId => activeId !== id);
        newCount = Math.max(0, currentCount - 1);
    } else {
        activeIds.push(id);
        newCount = currentCount + 1;
    }

    localStorage.setItem(storageKey, JSON.stringify(activeIds));
    if(countSpan) countSpan.innerText = newCount;

    if(!supabaseClient){  
        supabaseClient=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);  
    }  

    let updateData = {};
    updateData[dbColumn] = newCount;

    await supabaseClient
        .from('confessions')
        .update(updateData)
        .eq('id', id);
}
</script>  
</body>  
</html>
