<!DOCTYPE html>  
<html lang="en">  
<head>  
<meta charset="UTF-8">  
<meta name="viewport" content="width=device-width, initial-scale=1.0">  
<title>Confession Box</title>  
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>  
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>  
:root {  
    --bg-dark: #09090b;
    --card-bg: rgba(18, 18, 18, 0.85);
    --border-color: rgba(255, 255, 255, 0.08);
    --text-primary: #f4f4f5;
    --text-secondary: #a1a1aa;
    --accent-gradient: linear-gradient(135deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
    --accent-solid: #e1306c;
    --accent-blue: #0095f6;
    --font-main: 'Plus Jakarta Sans', -apple-system, sans-serif;
}  
  
*, *::before, *::after {
    box-sizing: border-box;
}

body {  
    font-family: var(--font-main);  
    background-color: var(--bg-dark);  
    background-image: 
        radial-gradient(circle at top right, rgba(225, 48, 108, 0.08), transparent 45%),
        radial-gradient(circle at bottom left, rgba(0, 149, 246, 0.08), transparent 45%);
    color: var(--text-primary);
    margin: 0;  
    display: flex;  
    justify-content: center;  
    align-items: center;  
    height: 100vh;  
    overflow: hidden;
}  
  
.card {  
    background: var(--card-bg);  
    border: 1px solid var(--border-color);  
    backdrop-filter: blur(25px);  
    -webkit-backdrop-filter: blur(25px);  
    border-radius: 28px;  
    width: 100%;  
    max-width: 400px;  
    height: 85vh;
    max-height: 800px;
    display: flex;
    flex-direction: column;
    overflow: hidden;  
    box-shadow: 0 24px 60px rgba(0,0,0,0.6);  
    position: relative;
    transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
}  
  
.fullscreen {  
    position: fixed;  
    top: 0;  
    left: 0;  
    width: 100% !important;  
    height: 100% !important;  
    max-width: none !important;  
    max-height: none !important;
    border-radius: 0 !important;  
    border: none !important;
    padding: 0 !important;  
    margin: 0 !important;  
    z-index: 5;  
}  
  
.view-pane {
    display: flex;
    flex-direction: column;
    width: 100%;
    height: 100%;
    padding: 30px 24px calc(90px + env(safe-area-inset-bottom, 0px)) 24px;
    overflow-y: auto;
    scrollbar-width: none;
    animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}

.view-pane::-webkit-scrollbar {
    display: none;
}

@keyframes slideUp {
    from {
        opacity: 0;
        transform: translateY(15px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

h2 {
    font-size: 24px;
    font-weight: 800;
    letter-spacing: -0.5px;
    margin-top: 0;
    margin-bottom: 24px;
    background: linear-gradient(135deg, #ffffff 0%, #a1a1aa 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    text-align: center;
}

input, select, textarea {  
    width: 100%;  
    background: rgba(255, 255, 255, 0.05);  
    border: 1px solid rgba(255, 255, 255, 0.08);  
    color: var(--text-primary);  
    font-family: var(--font-main);  
    padding: 14px 16px;  
    margin: 8px 0;  
    border-radius: 12px;  
    outline: none;  
    font-size: 14px;  
    transition: all 0.3s ease;  
}  
  
input:focus, select:focus, textarea:focus {  
    border-color: rgba(255, 255, 255, 0.25);  
    background: rgba(255, 255, 255, 0.08);  
    box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.03);  
}  
  
.select-wrapper {
    position: relative;
    width: 100%;
}

.select-wrapper::after {
    content: '▼';
    font-size: 8px;
    color: var(--text-secondary);
    position: absolute;
    right: 16px;
    top: 50%;
    transform: translateY(-50%);
    pointer-events: none;
}

select {  
    appearance: none;  
    cursor: pointer;  
}  
  
textarea {  
    height: 140px;  
    resize: none;  
    line-height: 1.5;  
}  
  
textarea::placeholder {  
    color: var(--text-secondary);  
    opacity: 0.6;  
}  
  
button {  
    width: 100%;  
    padding: 14px;  
    background: var(--accent-gradient);  
    color: white;  
    border: none;  
    border-radius: 12px;  
    font-weight: 700;  
    font-size: 14px;  
    cursor: pointer;  
    transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);  
    margin-top: 10px;  
}  
  
button:hover {  
    transform: translateY(-2px);  
    box-shadow: 0 8px 25px rgba(225, 48, 108, 0.35);  
}  
  
button:active {  
    transform: translateY(0) scale(0.98);  
}  
  
.tabs {  
    position: absolute;  
    bottom: 0;  
    left: 0;  
    width: 100%;  
    display: flex;  
    justify-content: space-around;  
    align-items: center;  
    background: rgba(15, 15, 15, 0.85);  
    backdrop-filter: blur(25px);  
    -webkit-backdrop-filter: blur(25px);  
    padding: 12px 0 calc(12px + env(safe-area-inset-bottom, 0px)) 0;  
    border-top: 1px solid var(--border-color);  
    z-index: 20;  
    transition: all 0.4s ease;  
}  
  
.tab {  
    display: flex;  
    flex-direction: column;  
    align-items: center;  
    justify-content: center;  
    color: var(--text-secondary);  
    font-size: 10px;  
    font-weight: 600;  
    cursor: pointer;  
    flex: 1;  
    transition: all 0.2s ease;  
    gap: 5px;  
}  
  
.tab svg {  
    width: 22px;  
    height: 22px;  
    fill: none;  
    stroke: currentColor;  
    stroke-width: 2;  
    transition: transform 0.2s ease;  
}  
  
.tab.active {  
    color: var(--text-primary);  
}  
  
.tab.active svg {  
    transform: scale(1.1);  
    stroke: var(--accent-solid);  
}  

.tab:active svg {  
    transform: scale(0.9);  
}  
  
.hidden {  
    display: none !important;  
}  

/* Live Online Banner Status */
.fomo-ticker {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    font-size: 13px;
    font-weight: 500;
    color: var(--text-primary);
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 20px;
    padding: 0;
    margin: 0 auto;
    max-height: 0;
    opacity: 0;
    transform: scale(0.95);
    overflow: hidden;
    transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    width: fit-content;
}

.fomo-ticker.visible {
    opacity: 1;
    transform: scale(1);
    max-height: 40px;
    padding: 8px 16px;
    margin: 0 auto 18px auto;
}

@keyframes pulseDot {
    0% { transform: scale(0.85); opacity: 0.5; box-shadow: 0 0 0 0 rgba(74, 222, 128, 0.7); }
    50% { transform: scale(1); opacity: 1; box-shadow: 0 0 0 6px rgba(74, 222, 128, 0); }
    100% { transform: scale(0.85); opacity: 0.5; box-shadow: 0 0 0 0 rgba(74, 222, 128, 0); }
}

.live-dot {
    height: 8px;
    width: 8px;
    background-color: #4ade80;
    border-radius: 50%;
    display: inline-block;
    animation: pulseDot 1.8s infinite ease-in-out;
}

/* Profiles view dynamic styles */
#profileInfo {
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid var(--border-color);
    padding: 16px;
    border-radius: 16px;
    font-size: 14px;
    line-height: 1.8;
    color: var(--text-primary);
    text-align: left;
    white-space: pre-line;
    margin-bottom: 20px;
}

#myConfessionsList {
    display: flex;
    flex-direction: column;
    gap: 10px;
    max-height: 200px;
    overflow-y: auto;
    scrollbar-width: none;
}

#myConfessionsList::-webkit-scrollbar {
    display: none;
}

.confess-item {
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid var(--border-color);
    padding: 14px;
    border-radius: 12px;
    font-size: 13px;
    color: var(--text-primary);
    display: flex;
    justify-content: space-between;
    align-items: center;
    box-sizing: border-box;
    transition: all 0.2s ease;
}

.confess-item:hover {
    background: rgba(255, 255, 255, 0.05);
    border-color: rgba(255, 255, 255, 0.15);
}

.confess-text {
    cursor: pointer;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    flex: 1;
    font-weight: 500;
}

.confess-delete-btn {
    cursor: pointer;
    padding: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 8px;
    transition: all 0.2s ease;
    color: #ef4444;
}

.confess-delete-btn:hover {
    background: rgba(239, 68, 68, 0.1);
}

.confess-delete-btn svg {
    width: 16px;
    height: 16px;
}

/* 🎬 ADDICTIVE SCROLL-SNAP NATIVE VERTICAL REELS ENGINE */
.reels-container {
    width: 100%;
    height: 100%;
    background: #000;
    overflow-y: scroll;
    scroll-snap-type: y mandatory;
    scrollbar-width: none;
    user-select: none;
    -webkit-user-select: none;
}

.reels-container::-webkit-scrollbar {
    display: none;
}

.reel-slide {
    width: 100%;
    height: 100%;
    scroll-snap-align: start;
    scroll-snap-stop: always;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    position: relative;
    padding: 30px;
    padding-bottom: 120px;
}

.reel-card {
    width: 100%;
    max-width: 320px;
    text-align: center;
    color: white;
    z-index: 10;
}

.reel-meta {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: rgba(255, 255, 255, 0.4);
    margin-bottom: 20px;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: rgba(255, 255, 255, 0.08);
    padding: 6px 12px;
    border-radius: 20px;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.05);
}

.reel-text {
    font-size: 22px;
    font-weight: 700;
    line-height: 1.5;
    text-shadow: 0 4px 16px rgba(0,0,0,0.4);
    word-break: break-word;
    overflow-wrap: anywhere;
    white-space: pre-wrap;
    max-height: 45vh;
    overflow-y: auto;
    scrollbar-width: none;
    padding: 10px;
}

.reel-text::-webkit-scrollbar {
    display: none;
}

/* Floating Vertical Tray Control Trackers */
.reels-sidebar {
    position: absolute;
    right: 20px;
    bottom: 140px;
    display: flex;
    flex-direction: column;
    gap: 20px;
    z-index: 15;
    background: rgba(255, 255, 255, 0.05);
    padding: 16px 10px;
    border-radius: 24px;
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255, 255, 255, 0.08);
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
}

.reel-side-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    color: white;
    font-size: 11px;
    font-weight: 500;
    cursor: pointer;
    gap: 4px;
}

.reel-side-icon {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: transparent;
    border: none;
    transition: all 0.2s ease;
}

.reel-side-icon:hover {
    transform: scale(1.1);
    background: rgba(255, 255, 255, 0.12);
}

.reel-side-icon:active {
    transform: scale(0.9);
}

/* Dynamic Reaction States styling */
.insta-icon {
    width: 22px;
    height: 22px;
    stroke: #ffffff;
    stroke-width: 2;
    fill: none;
    transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}

.reel-side-icon.liked .insta-icon {
    fill: #ff3040 !important;
    stroke: #ff3040 !important;
    transform: scale(1.15);
}

.reel-side-icon.fired .insta-icon {
    fill: #f97316 !important;
    stroke: #f97316 !important;
    transform: scale(1.15);
}

.reel-side-icon.laughed .insta-icon {
    fill: #eab308 !important;
    stroke: #eab308 !important;
    transform: scale(1.15);
}

.reel-side-item span[id^="reel-"] {
    color: rgba(255, 255, 255, 0.7);
    font-size: 11px;
    font-weight: 600;
}

/* Double-Tap Heart Pop Dynamic Animations */
@keyframes instaHeartPop {
    0% {
        transform: translate(-50%, -50%) scale(0) rotate(-15deg);
        opacity: 0;
    }
    15% {
        transform: translate(-50%, -50%) scale(1.3) rotate(5deg);
        opacity: 0.9;
    }
    30% {
        transform: translate(-50%, -50%) scale(0.9) rotate(-3deg);
        opacity: 0.9;
    }
    45% {
        transform: translate(-50%, -50%) scale(1) rotate(0deg);
        opacity: 1;
    }
    80% {
        transform: translate(-50%, -50%) scale(1) rotate(0deg);
        opacity: 1;
    }
    100% {
        transform: translate(-50%, -50%) scale(0) rotate(0deg);
        opacity: 0;
    }
}

.pop-heart {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 100px;
    height: 100px;
    color: #ff3040;
    fill: #ff3040;
    pointer-events: none;
    z-index: 100;
    animation: instaHeartPop 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    filter: drop-shadow(0 10px 25px rgba(0,0,0,0.5));
}

/* Laughing Emoji Pop Animation */
@keyframes laughPop {
    0% {
        transform: translate(-50%, -50%) scale(0) rotate(-10deg);
        opacity: 0;
    }
    20% {
        transform: translate(-50%, -50%) scale(1.4) rotate(10deg);
        opacity: 1;
    }
    40% {
        transform: translate(-50%, -50%) scale(1.1) rotate(-10deg);
    }
    60% {
        transform: translate(-50%, -50%) scale(1.3) rotate(10deg);
        opacity: 1;
    }
    80% {
        transform: translate(-50%, -50%) scale(1) translateY(-30px);
        opacity: 1;
    }
    100% {
        transform: translate(-50%, -50%) scale(0) translateY(-70px);
        opacity: 0;
    }
}

.pop-laugh {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 64px;
    pointer-events: none;
    z-index: 100;
    animation: laughPop 1s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    filter: drop-shadow(0 10px 25px rgba(0,0,0,0.5));
}

/* Dark variant configurations shifting tab navigation appearance inside reels view */
.tabs.reels-darkmode {
    background: rgba(10, 10, 10, 0.8) !important;
    backdrop-filter: blur(30px);
    -webkit-backdrop-filter: blur(30px);
    box-shadow: 0 -4px 30px rgba(0,0,0,0.6) !important;
    border-top: 1px solid rgba(255, 255, 255, 0.05);
}
.tabs.reels-darkmode .tab {
    color: rgba(255, 255, 255, 0.4);
}
.tabs.reels-darkmode .tab.active {
    color: var(--text-primary);
}
</style>  
</head>  
<body>  
<div class="card">  
<div id="registerView" class="view-pane">  
    <h2>Create Profile</h2>  
    <input id="username" placeholder="Your Name">  
    <input id="userclass" placeholder="Class / Section">  
    <div class="select-wrapper">
        <select id="usergender">  
            <option disabled selected>Select Gender</option>  
            <option>Male</option>  
            <option>Female</option>  
        </select>  
    </div>
    <button onclick="saveProfile()">Create Profile</button>  
</div>  
<div id="confessionView" class="view-pane hidden">  
    <h2>Express Your Feelings ❤️</h2>  
    <div id="fomoTicker" class="fomo-ticker"></div>
    <textarea id="confessionMessage" placeholder="Write your secret confession here..."></textarea>  
    <button id="sendBtn" onclick="sendConfession()">Send Confession 🚀</button>  
    <p id="sendLabel" style="font-weight: 500; font-size: 13px; text-align: center; margin-top: 10px;"></p>
</div>  
<div id="profileView" class="view-pane hidden">  
    <h2>Your Profile</h2>  
    <p id="profileInfo"></p>  
    <button onclick="showEdit()">Edit Profile</button>  
    <hr style="border:0; border-top:1px solid var(--border-color); margin:24px 0;">
    <h3 style="color:var(--accent-solid); font-size:16px; margin:0 0 14px 0; font-weight: 600; text-align: left;">Your Uploads</h3>
    <div id="myConfessionsList"></div>
</div>  
<div id="editView" class="view-pane hidden">  
    <h2>Edit Profile</h2>  
    <input id="editName">  
    <input id="editClass">  
    <div class="select-wrapper">
        <select id="editGender">  
            <option>Male</option>  
            <option>Female</option>  
        </select>  
    </div>
    <button onclick="updateProfile()">Save Changes</button>  
</div>  

<div id="reelsView" class="view-pane hidden" style="padding:0 !important; overflow:hidden !important;">
    <div class="reels-container" id="reelsContainer"></div>
</div>

</div>  

<div class="tabs hidden" id="tabs">  
    <div class="tab" onclick="showTab('profile')">
        <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
        </svg>
        <span>You</span>
    </div>  
    <div class="tab active" onclick="showTab('confession')">
        <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
        <span>Confess</span>
    </div>  
    <div class="tab" onclick="showTab('reels')">
        <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="23 7 16 12 23 17 23 7"></polygon>
            <rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect>
        </svg>
        <span>Feeds</span>
    </div>  
</div>  

<script>  
const SUPABASE_URL="https://gsckseffapurzqkexeup.supabase.co";  
const SUPABASE_ANON_KEY="sb_publishable_JWdBSaFEpNjTuKEHTcno5w_9hKO5Eu7";  
  
let supabaseClient;  

// Ambient dark, non-cringe Instagram aesthetics
const aestheticBackdropPalettes = [
    "radial-gradient(circle at top, #1e1b4b 0%, #09090b 100%)",
    "radial-gradient(circle at top, #3b0764 0%, #09090b 100%)",
    "radial-gradient(circle at top, #1c1917 0%, #0c0a09 100%)",
    "radial-gradient(circle at top, #0f172a 0%, #020617 100%)",
    "radial-gradient(circle at top, #064e3b 0%, #022c22 100%)",
    "radial-gradient(circle at top, #581c87 0%, #09090b 100%)",
    "radial-gradient(circle at top, #7c2d12 0%, #09090b 100%)"
];

// Target Elements
const viewRegister = document.getElementById('registerView');
const viewConfession = document.getElementById('confessionView');
const viewProfile = document.getElementById('profileView');
const viewEdit = document.getElementById('editView');
const viewReels = document.getElementById('reelsView');
const navigationTabs = document.getElementById('tabs');

const inputUsername = document.getElementById('username');
const inputUserclass = document.getElementById('userclass');
const selectUsergender = document.getElementById('usergender');

const inputEditName = document.getElementById('editName');
const inputEditClass = document.getElementById('editClass');
const selectEditGender = document.getElementById('editGender');

const labelProfileInfo = document.getElementById('profileInfo');
const txtConfessionMessage = document.getElementById('confessionMessage');
const labelSendLabel = document.getElementById('sendLabel');
  
// Boot State Controller Action Verification Logic
window.onload=()=>{  
    if(localStorage.getItem('sb_name')){  
        viewRegister.classList.add('hidden');  
        navigationTabs.classList.remove('hidden');  
        showTab('confession');  
    }  
};  
  
/* Profile processing workflows */  
async function loadProfile(){  
    labelProfileInfo.innerText =  
    `Name: ${localStorage.getItem('sb_name')}  
Class: ${localStorage.getItem('sb_class')}  
Gender: ${localStorage.getItem('sb_gender')}`;  

    const listContainer = document.getElementById('myConfessionsList');
    if (!listContainer) return;
    listContainer.innerHTML = "<p style='color:var(--text-secondary); text-align:center; font-size:13px; opacity:0.7;'>Loading your items...</p>";

    if(!supabaseClient){  
        supabaseClient=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);  
    }  

    const {data, error} = await supabaseClient
        .from('confessions')
        .select('*')
        .eq('name', localStorage.getItem('sb_name'))
        .order('id', {ascending: false});

    if (error || !data || data.length === 0) {
        listContainer.innerHTML= "<p style='color:var(--text-secondary); text-align:center; font-size:13px; opacity:0.7;'>No confessions uploaded yet.</p>";
        return;
    }

    listContainer.innerHTML = "";
    data.forEach(item => {
        const itemDiv = document.createElement('div');
        itemDiv.className = 'confess-item';

        const textSpan = document.createElement('span');
        textSpan.className = 'confess-text';
        textSpan.innerText = item.message;
        textSpan.onclick = () => showTab('reels', item.id);

        const deleteBtn = document.createElement('span');
        deleteBtn.className = 'confess-delete-btn';
        deleteBtn.innerHTML = `
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="3 6 5 6 21 6"></polyline>
                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path> <line x1="10" y1="11" x2="10" y2="17"></line>
                <line x1="14" y1="11" x2="14" y2="17"></line>
            </svg>
        `;
        deleteBtn.onclick = async (e) => {
            e.stopPropagation();
            if(confirm("Are you sure you want to delete this confession?")) {
                await deleteConfession(item.id, itemDiv);
            }
        };

        itemDiv.appendChild(textSpan);
        itemDiv.appendChild(deleteBtn);
        listContainer.appendChild(itemDiv);
    });
}  

async function deleteConfession(id, element) {
    if(!supabaseClient){  
        supabaseClient=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);  
    }  
    const { error } = await supabaseClient
        .from('confessions')
        .delete()
        .eq('id', id);

    if (error) {
        alert("Error deleting confession: " + error.message);
    } else {
        element.remove();
        const listContainer = document.getElementById('myConfessionsList');
        if (listContainer && listContainer.children.length === 0) {
            listContainer.innerHTML = "<p style='color:var(--text-secondary); text-align:center; font-size:13px; opacity:0.7;'>No confessions uploaded yet.</p>";
        }
    }
}

function saveProfile(){  
    if(!inputUsername.value || !inputUserclass.value || selectUsergender.selectedIndex===0){  
        alert("Fill all fields");  
        return;  
    }  
  
    localStorage.setItem('sb_name', inputUsername.value);  
    localStorage.setItem('sb_class', inputUserclass.value);  
    localStorage.setItem('sb_gender', selectUsergender.value);  
  
    viewRegister.classList.add('hidden');  
    navigationTabs.classList.remove('hidden');  
    showTab('confession');  
}  
  
/* Edit parameters mapping configurations */  
function showEdit(){  
    viewProfile.classList.add('hidden');  
    viewEdit.classList.remove('hidden');  
  
    inputEditName.value=localStorage.getItem('sb_name');  
    inputEditClass.value=localStorage.getItem('sb_class');  
    selectEditGender.value=localStorage.getItem('sb_gender');  
}  
  
function updateProfile(){  
    localStorage.setItem('sb_name', inputEditName.value);  
    localStorage.setItem('sb_class', inputEditClass.value);  
    localStorage.setItem('sb_gender', selectEditGender.value);  
  
    viewEdit.classList.add('hidden');  
    viewProfile.classList.remove('hidden');  
    loadProfile();  
}  
  
/* Router system view navigation engine switcher */  
function showTab(tab, targetId = null){  
    viewConfession.classList.add('hidden');  
    viewProfile.classList.add('hidden');  
    viewEdit.classList.add('hidden');  
    viewReels.classList.add('hidden');
  
    document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));  
    const mainCard = document.querySelector('.card');
    
    mainCard.classList.remove('fullscreen');  
    navigationTabs.classList.remove('reels-darkmode');

    if(tab==='profile'){  
        viewProfile.classList.remove('hidden');  
        loadProfile();  
        document.querySelectorAll('.tab')[0].classList.add('active');  
    }  
    if(tab==='confession'){  
        viewConfession.classList.remove('hidden');  
        updateFomoTicker();
        document.querySelectorAll('.tab')[1].classList.add('active');  
    }  
    if(tab==='reels'){
        viewReels.classList.remove('hidden');
        mainCard.classList.add('fullscreen');
        navigationTabs.classList.add('reels-darkmode');
        document.querySelectorAll('.tab')[2].classList.add('active');
        initiateReelsEngine(targetId);
    }
}  
  
/* Word filter validation parsing engine layout rules */  
async function sendConfession(){  
    const msg=txtConfessionMessage.value.trim();  
    const label=labelSendLabel;  
    const btn=document.getElementById("sendBtn");  
  
    const banned=["fuck","ass","randi","chod","chut","lund","gand","sex","bitch","slut"];  
  
    if(!msg){  
        alert("Type message");  
        return;  
    }  
  
    const lower=msg.toLowerCase();  
    for(let w of banned){  
        if(lower.includes(w)){  
            label.style.color="#ef4444";  
            label.innerText="Don't use abusive words.";  
            return;  
        }  
    }  
  
    label.style.color="#f59e0b";  
    label.innerText="Sending...";  
    btn.disabled=true;  
  
    if(!supabaseClient){  
        supabaseClient=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);  
    }  
  
    const {error}=await supabaseClient.from('confessions').insert([{  
        name:localStorage.getItem('sb_name'),  
        class:localStorage.getItem('sb_class'),  
        gender:localStorage.getItem('sb_gender'),  
        message:msg  
    }]);  
  
    btn.disabled=false;  
  
    if(error){  
        label.style.color="#ef4444";  
        label.innerText="Error sending message.";  
    } else {  
        label.style.color="#10b981";  
        label.innerText="Sent successfully ✨";  
        txtConfessionMessage.value="";  
    }  
}  

/* Live online activity mock logic calculations */
function updateFomoTicker() {
    const ticker = document.getElementById('fomoTicker');
    if (!ticker) return;

    ticker.classList.remove('visible');

    const currentHour = new Date().getHours();
    let min = 0, max = 0;

    if (currentHour >= 14 && currentHour < 20) { min = 9; max = 16; } 
    else if (currentHour >= 21 && currentHour < 22) { min = 3; max = 4; } 
    else if (currentHour >= 22 || currentHour < 8) { min = 0; max = 0; } 
    else if (currentHour >= 9 && currentHour < 13) { min = 5; max = 8; } 
    else {
        if (currentHour === 8 || currentHour === 20) { min = 3; max = 5; }
        else { min = 6; max = 8; }
    }

    const activeUsers = min === max ? min : Math.floor(Math.random() * (max - min + 1)) + min; 
    
    if (activeUsers === 0) return;

    ticker.innerHTML = `<span class="live-dot"></span> <b>${activeUsers} people online</b>`;
    
    setTimeout(() => {
        ticker.classList.add('visible');
    }, 150);
}

/* 🎬 MULTI-PAGE SNAP REELS COMPILER */
async function initiateReelsEngine(targetId = null) {
    const container = document.getElementById('reelsContainer');
    container.innerHTML = "<p style='color:rgba(255,255,255,0.4); text-align:center; padding-top:45vh; font-size:14px; font-weight:500;'>Preparing Secrets Feed...</p>";

    if(!supabaseClient){  
        supabaseClient=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);  
    }

    const {data, error} = await supabaseClient
        .from('confessions')
        .select('*')
        .order('id', {ascending: false});

    if (error || !data || data.length === 0) {
        container.innerHTML = "<p style='color:white; text-align:center; padding-top:45vh; opacity:0.6;'>No secrets discovered yet.</p>";
        return;
    }

    // Shuffle data pool to deliver unpredictable content layout sequences
    const shuffledReels = data.sort(() => Math.random() - 0.5);
    container.innerHTML = "";

    const loveIds = getReactedIds('love');
    const fireIds = getReactedIds('fire');
    const laughIds = getReactedIds('laugh');

    shuffledReels.forEach((item, index) => {
        const gradientIndex = index % aestheticBackdropPalettes.length;
        const currentBackground = aestheticBackdropPalettes[gradientIndex];

        let profileTag = item.name === localStorage.getItem('sb_name') ? "YOU" : "ANONYMOUS";
        
        let isLove = loveIds.includes(item.id);
        let isFire = fireIds.includes(item.id);
        let isLaugh = laughIds.includes(item.id);

        let loveClass = isLove ? "liked" : "";
        let fireClass = isFire ? "fired" : "";
        let laughClass = isLaugh ? "laughed" : "";

        const slide = document.createElement('div');
        slide.className = 'reel-slide';
        slide.id = `reel-slide-${item.id}`;
        slide.style.background = currentBackground;

        slide.innerHTML = `
            <div class="reel-card">
                <div class="reel-meta">🤫 Class ${item.class} (${profileTag})</div>
                <div class="reel-text">${item.message}</div>
            </div>
            <div class="reels-sidebar">
                <div class="reel-side-item" onclick="executeReelReaction(${item.id}, 'love')">
                    <span class="reel-side-icon ${loveClass}" id="reel-love-btn-${item.id}">
                        <svg class="insta-icon" viewBox="0 0 24 24">
                            <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
                        </svg>
                    </span>
                    <span id="reel-love-count-${item.id}">${item.likes || 0}</span>
                </div>
                <div class="reel-side-item" onclick="executeReelReaction(${item.id}, 'fire')">
                    <span class="reel-side-icon ${fireClass}" id="reel-fire-btn-${item.id}">
                        <svg class="insta-icon" viewBox="0 0 24 24">
                            <path d="M17.557 12c.113.626.13 1.157.051 1.59-.226 1.238-.85 2.378-1.761 3.211a7.218 7.218 0 01-4.839 1.831c-1.895 0-3.64-.72-4.966-2.029a7.352 7.352 0 01-1.921-5.111c.015-1.866.758-3.568 2.029-4.814.195-.19.467-.253.719-.163.253.09.428.312.451.579.053.606.278 1.185.651 1.674.341.448.814.795 1.349.991.139.051.245.161.285.301.04.14-.002.29-.111.391-.497.46-.8 1.111-.849 1.801a2.38 2.38 0 00.701 1.761c.451.451 1.056.701 1.696.701.616 0 1.205-.236 1.642-.656.326-.313.486-.745.452-1.21-.035-.484-.24-.93-.578-1.26a4.4 4.4 0 00-1.879-1.077c-.244-.069-.408-.285-.407-.539a.555.555 0 01.373-.518c2.256-.844 3.737-3.053 3.593-5.358a.56.56 0 01.328-.518.56.56 0 01.6.101 12.162 12.162 0 013.238 6.57c.18 1.096.113 2.13-.198 3.125z"/>
                        </svg>
                    </span>
                    <span id="reel-fire-count-${item.id}">${item.react_fire || 0}</span>
                </div>
                <div class="reel-side-item" onclick="executeReelReaction(${item.id}, 'laugh')">
                    <span class="reel-side-icon ${laughClass}" id="reel-laugh-btn-${item.id}">
                        <svg class="insta-icon" viewBox="0 0 24 24">
                            <circle cx="12" cy="12" r="10"/>
                            <path d="M8 14s1.5 2 4 2 4-2 4-2" stroke-linecap="round"/>
                            <path d="M9 9l1 1m-1 0l1-1m5 0l1 1m-1 0l1-1" stroke-linecap="round"/>
                        </svg>
                    </span>
                    <span id="reel-laugh-count-${item.id}">${item.react_laugh || 0}</span>
                </div>
            </div>
        `;

        // 📱 ADDING DOUBLE-TAP DETECTION WITH HIGH COMPATIBILITY
        let lastTap = 0;
        slide.addEventListener('click', (e) => {
            // Ensure double tap isn't registered when tapping reaction controls
            if (e.target.closest('.reels-sidebar')) return;

            const now = Date.now();
            if (now - lastTap < 300) {
                // Instantly register Love reaction (forces active, matching IG style)
                executeReelReaction(item.id, 'love', true);
                showFloatingHeart(slide);
            }
            lastTap = now;
        });

        container.appendChild(slide);
    });

    if (targetId) {
        const targetSlide = document.getElementById(`reel-slide-${targetId}`);
        if (targetSlide) {
            setTimeout(() => {
                targetSlide.scrollIntoView({ behavior: 'auto' });
            }, 100);
        }
    }
}

/* Local reaction process interfaces running dynamic database pipelines */
async function executeReelReaction(id, type, forceActive = false) {
    await toggleReaction(id, type, forceActive);

    const loveIds = getReactedIds('love');
    const fireIds = getReactedIds('fire');
    const laughIds = getReactedIds('laugh');

    const loveBtn = document.getElementById(`reel-love-btn-${id}`);
    const fireBtn = document.getElementById(`reel-fire-btn-${id}`);
    const laughBtn = document.getElementById(`reel-laugh-btn-${id}`);

    if(type === 'love' && loveBtn) {
        if (loveIds.includes(id)) {
            loveBtn.classList.add('liked');
        } else {
            loveBtn.classList.remove('liked');
        }
    }
    if(type === 'fire' && fireBtn) {
        if (fireIds.includes(id)) {
            fireBtn.classList.add('fired');
        } else {
            fireBtn.classList.remove('fired');
        }
    }
    if(type === 'laugh' && laughBtn) {
        if (laughIds.includes(id)) {
            laughBtn.classList.add('laughed');
            const slide = document.getElementById(`reel-slide-${id}`);
            showFloatingLaugh(slide);
        } else {
            laughBtn.classList.remove('laughed');
        }
    }
}

function getReactedIds(type) {
    let storageKey = type === 'love' ? 'sb_liked_confessions' : `sb_react_${type}`;
    try {
        return JSON.parse(localStorage.getItem(storageKey)) || [];
    } catch(e) {
        return [];
    }
}

async function toggleReaction(id, type, forceActive = false) {
    let storageKey = type === 'love' ? 'sb_liked_confessions' : `sb_react_${type}`;
    let dbColumn = type === 'love' ? 'likes' : (type === 'fire' ? 'react_fire' : 'react_laugh');
    
    let activeIds = getReactedIds(type);
    const countSpan = document.getElementById(`reel-${type}-count-${id}`);
    let currentCount = countSpan ? (parseInt(countSpan.innerText) || 0) : 0;
    
    let hasReacted = activeIds.includes(id);

    // Instagram logic: Double-tapping an already liked item only plays animation, doesn't unlike it
    if (forceActive && hasReacted) {
        return; 
    }

    let newCount = currentCount;

    if (hasReacted) {
        activeIds = activeIds.filter(activeId => activeId !== id);
        newCount = Math.max(0, currentCount - 1);
    } else {
        activeIds.push(id);
        newCount = currentCount + 1;
    }

    localStorage.setItem(storageKey, JSON.stringify(activeIds));
    if(countSpan) countSpan.innerText = newCount;

    if(!supabaseClient){  
        supabaseClient=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);  
    }  

    let updateData = {};
    updateData[dbColumn] = newCount;

    await supabaseClient
        .from('confessions')
        .update(updateData)
        .eq('id', id);
}

// 💖 SPARK POP FLOATING HEART CREATION UTILITY
function showFloatingHeart(slide) {
    const heart = document.createElement('div');
    heart.className = 'pop-heart';
    heart.innerHTML = `
        <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
        </svg>
    `;
    slide.appendChild(heart);
    
    // Automatically dispose after dynamic scale cycle concludes
    setTimeout(() => {
        heart.remove();
    }, 800);
}

// 😂 LAUGH POP FLOATING EMOJI CREATION UTILITY
function showFloatingLaugh(slide) {
    if (!slide) return;
    const laugh = document.createElement('div');
    laugh.className = 'pop-laugh';
    laugh.innerText = '😂';
    slide.appendChild(laugh);
    
    setTimeout(() => {
        laugh.remove();
    }, 1000);
}
