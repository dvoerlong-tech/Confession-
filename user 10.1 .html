<!DOCTYPE html>  
<html lang="en">  
<head>  
<meta charset="UTF-8">  
<meta name="viewport" content="width=device-width, initial-scale=1.0">  
<title>Confession Box</title>  
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>  
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>  
:root {  
    --bg-dark: #09090b;
    --card-bg: rgba(18, 18, 18, 0.85);
    --border-color: rgba(255, 255, 255, 0.08);
    --text-primary: #f4f4f5;
    --text-secondary: #a1a1aa;
    --accent-gradient: linear-gradient(135deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
    --accent-solid: #e1306c;
    --accent-blue: #0095f6;
    --font-main: 'Plus Jakarta Sans', -apple-system, sans-serif;
}  
  
*, *::before, *::after {
    box-sizing: border-box;
}

body {  
    font-family: var(--font-main);  
    background-color: var(--bg-dark);  
    background-image: 
        radial-gradient(circle at top right, rgba(225, 48, 108, 0.08), transparent 45%),
        radial-gradient(circle at bottom left, rgba(0, 149, 246, 0.08), transparent 45%);
    color: var(--text-primary);
    margin: 0;  
    display: flex;  
    justify-content: center;  
    align-items: center;  
    height: 100vh;  
    overflow: hidden;
}  
  
.card {  
    background: var(--card-bg);  
    border: 1px solid var(--border-color);  
    backdrop-filter: blur(25px);  
    -webkit-backdrop-filter: blur(25px);  
    border-radius: 28px;  
    width: 100%;  
    max-width: 400px;  
    height: 85vh;
    max-height: 800px;
    display: flex;
    flex-direction: column;
    overflow: hidden;  
    box-shadow: 0 24px 60px rgba(0,0,0,0.6);  
    position: relative;
    transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
}  
  
.fullscreen {  
    position: fixed;  
    top: 0;  
    left: 0;  
    width: 100% !important;  
    height: 100% !important;  
    max-width: none !important;  
    max-height: none !important;
    border-radius: 0 !important;  
    border: none !important;
    padding: 0 !important;  
    margin: 0 !important;  
    z-index: 5;  
}  
  
.view-pane {
    display: flex;
    flex-direction: column;
    width: 100%;
    height: 100%;
    padding: 30px 24px calc(90px + env(safe-area-inset-bottom, 0px)) 24px;
    overflow-y: auto;
    scrollbar-width: none;
    animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}

.view-pane::-webkit-scrollbar {
    display: none;
}

@keyframes slideUp {
    from {
        opacity: 0;
        transform: translateY(15px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

h2 {
    font-size: 24px;
    font-weight: 800;
    letter-spacing: -0.5px;
    margin-top: 0;
    margin-bottom: 24px;
    background: linear-gradient(135deg, #ffffff 0%, #a1a1aa 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    text-align: center;
}

input, select, textarea {  
    width: 100%;  
    background: rgba(255, 255, 255, 0.05);  
    border: 1px solid rgba(255, 255, 255, 0.08);  
    color: var(--text-primary);  
    font-family: var(--font-main);  
    padding: 14px 16px;  
    margin: 8px 0;  
    border-radius: 12px;  
    outline: none;  
    font-size: 14px;  
    transition: all 0.3s ease;  
}  
  
input:focus, select:focus, textarea:focus {  
    border-color: rgba(255, 255, 255, 0.25);  
    background: rgba(255, 255, 255, 0.08);  
    box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.03);  
}  
  
.select-wrapper {
    position: relative;
    width: 100%;
}

.select-wrapper::after {
    content: '▼';
    font-size: 8px;
    color: var(--text-secondary);
    position: absolute;
    right: 16px;
    top: 50%;
    transform: translateY(-50%);
    pointer-events: none;
}

select {  
    appearance: none;  
    cursor: pointer;  
}  
  
textarea {  
    height: 140px;  
    resize: none;  
    line-height: 1.5;  
}  
  
textarea::placeholder {  
    color: var(--text-secondary);  
    opacity: 0.6;  
}  
  
button {  
    width: 100%;  
    padding: 14px;  
    background: var(--accent-gradient);  
    color: white;  
    border: none;  
    border-radius: 12px;  
    font-weight: 700;  
    font-size: 14px;  
    cursor: pointer;  
    transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);  
    margin-top: 10px;  
}  
  
button:hover {  
    transform: translateY(-2px);  
    box-shadow: 0 8px 25px rgba(225, 48, 108, 0.35);  
}  
  
button:active {  
    transform: translateY(0) scale(0.98);  
}  
  
.tabs {  
    position: absolute;  
    bottom: 0;  
    left: 0;  
    width: 100%;  
    display: flex;  
    justify-content: space-around;  
    align-items: center;  
    background: rgba(15, 15, 15, 0.85);  
    backdrop-filter: blur(25px);  
    -webkit-backdrop-filter: blur(25px);  
    padding: 12px 0 calc(12px + env(safe-area-inset-bottom, 0px)) 0;  
    border-top: 1px solid var(--border-color);  
    z-index: 20;  
    transition: all 0.4s ease;  
}  
  
.tab {  
    display: flex;  
    flex-direction: column;  
    align-items: center;  
    justify-content: center;  
    color: var(--text-secondary);  
    font-size: 10px;  
    font-weight: 600;  
    cursor: pointer;  
    flex: 1;  
    transition: all 0.2s ease;  
    gap: 5px;  
}  
  
.tab svg {  
    width: 22px;  
    height: 22px;  
    fill: none;  
    stroke: currentColor;  
    stroke-width: 2;  
    transition: transform 0.2s ease;  
}  
  
.tab.active {  
    color: var(--text-primary);  
}  
  
.tab.active svg {  
    transform: scale(1.1);  
    stroke: var(--accent-solid);  
}  

.tab:active svg {  
    transform: scale(0.9);  
}  
  
.hidden {  
    display: none !important;  
}  

.fomo-ticker {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    font-size: 13px;
    font-weight: 500;
    color: var(--text-primary);
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 20px;
    padding: 0;
    margin: 0 auto;
    max-height: 0;
    opacity: 0;
    transform: scale(0.95);
    overflow: hidden;
    transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    width: fit-content;
}

.fomo-ticker.visible {
    opacity: 1;
    transform: scale(1);
    max-height: 40px;
    padding: 8px 16px;
    margin: 0 auto 18px auto;
}

@keyframes pulseDot {
    0% { transform: scale(0.85); opacity: 0.5; box-shadow: 0 0 0 0 rgba(74, 222, 128, 0.7); }
    50% { transform: scale(1); opacity: 1; box-shadow: 0 0 0 6px rgba(74, 222, 128, 0); }
    100% { transform: scale(0.85); opacity: 0.5; box-shadow: 0 0 0 0 rgba(74, 222, 128, 0); }
}

.live-dot {
    height: 8px;
    width: 8px;
    background-color: #4ade80;
    border-radius: 50%;
    display: inline-block;
    animation: pulseDot 1.8s infinite ease-in-out;
}

#profileInfo {
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid var(--border-color);
    padding: 16px;
    border-radius: 16px;
    font-size: 14px;
    line-height: 1.8;
    color: var(--text-primary);
    text-align: left;
    white-space: pre-line;
    margin-bottom: 20px;
}

#myConfessionsList, #searchResults, #friendRequestsList, #friendsList {
    display: flex;
    flex-direction: column;
    gap: 10px;
    max-height: 200px;
    overflow-y: auto;
    scrollbar-width: none;
}

#myConfessionsList::-webkit-scrollbar, #searchResults::-webkit-scrollbar, #friendRequestsList::-webkit-scrollbar, #friendsList::-webkit-scrollbar {
    display: none;
}

.confess-item {
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid var(--border-color);
    padding: 14px;
    border-radius: 12px;
    font-size: 13px;
    color: var(--text-primary);
    display: flex;
    justify-content: space-between;
    align-items: center;
    box-sizing: border-box;
    transition: all 0.2s ease;
}

.confess-item:hover {
    background: rgba(255, 255, 255, 0.05);
    border-color: rgba(255, 255, 255, 0.15);
}

.confess-text {
    cursor: pointer;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    flex: 1;
    font-weight: 500;
}

.confess-delete-btn {
    cursor: pointer;
    padding: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 8px;
    transition: all 0.2s ease;
    color: #ef4444;
}

.confess-delete-btn:hover {
    background: rgba(239, 68, 68, 0.1);
}

.confess-delete-btn svg {
    width: 16px;
    height: 16px;
}

.reels-container {
    width: 100%;
    height: 100%;
    background: #000;
    overflow-y: scroll;
    scroll-snap-type: y mandatory;
    scrollbar-width: none;
    user-select: none;
    -webkit-user-select: none;
}

.reels-container::-webkit-scrollbar {
    display: none;
}

.reel-slide {
    width: 100%;
    height: 100%;
    scroll-snap-align: start;
    scroll-snap-stop: always;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    position: relative;
    padding: 30px;
    padding-bottom: 120px;
}

.reel-card {
    width: 100%;
    max-width: 320px;
    text-align: center;
    color: white;
    z-index: 10;
}

.reel-meta {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: rgba(255, 255, 255, 0.4);
    margin-bottom: 20px;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: rgba(255, 255, 255, 0.08);
    padding: 6px 12px;
    border-radius: 20px;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.05);
}

.reel-text {
    font-size: 22px;
    font-weight: 700;
    line-height: 1.5;
    text-shadow: 0 4px 16px rgba(0,0,0,0.4);
    word-break: break-word;
    overflow-wrap: anywhere;
    white-space: pre-wrap;
    max-height: 45vh;
    overflow-y: auto;
    scrollbar-width: none;
    padding: 10px;
}

.reel-text::-webkit-scrollbar {
    display: none;
}

.reels-sidebar {
    position: absolute;
    right: 20px;
    bottom: 140px;
    display: flex;
    flex-direction: column;
    gap: 20px;
    z-index: 15;
    background: rgba(255, 255, 255, 0.05);
    padding: 16px 10px;
    border-radius: 24px;
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255, 255, 255, 0.08);
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
}

.reel-side-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    color: white;
    font-size: 11px;
    font-weight: 500;
    cursor: pointer;
    gap: 4px;
}

.reel-side-icon {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: transparent;
    border: none;
    transition: all 0.2s ease;
}

.reel-side-icon:hover {
    transform: scale(1.1);
    background: rgba(255, 255, 255, 0.12);
}

.reel-side-icon:active {
    transform: scale(0.9);
}

.insta-icon {
    width: 22px;
    height: 22px;
    stroke: #ffffff;
    stroke-width: 2;
    fill: none;
    transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}

.reel-side-icon.liked .insta-icon {
    fill: #ff3040 !important;
    stroke: #ff3040 !important;
    transform: scale(1.15);
}

.reel-side-icon.fired .insta-icon {
    fill: #f97316 !important;
    stroke: #f97316 !important;
    transform: scale(1.15);
}

.reel-side-icon.laughed .insta-icon {
    fill: #eab308 !important;
    stroke: #eab308 !important;
    transform: scale(1.15);
}

.reel-side-item span[id^="reel-"] {
    color: rgba(255, 255, 255, 0.7);
    font-size: 11px;
    font-weight: 600;
}

@keyframes instaHeartPop {
    0% { transform: translate(-50%, -50%) scale(0) rotate(-15deg); opacity: 0; }
    15% { transform: translate(-50%, -50%) scale(1.3) rotate(5deg); opacity: 0.9; }
    30% { transform: translate(-50%, -50%) scale(0.9) rotate(-3deg); opacity: 0.9; }
    45% { transform: translate(-50%, -50%) scale(1) rotate(0deg); opacity: 1; }
    80% { transform: translate(-50%, -50%) scale(1) rotate(0deg); opacity: 1; }
    100% { transform: translate(-50%, -50%) scale(0) rotate(0deg); opacity: 0; }
}

.pop-heart {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 100px;
    height: 100px;
    color: #ff3040;
    fill: #ff3040;
    pointer-events: none;
    z-index: 100;
    animation: instaHeartPop 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    filter: drop-shadow(0 10px 25px rgba(0,0,0,0.5));
}

@keyframes laughPop {
    0% { transform: translate(-50%, -50%) scale(0) rotate(-10deg); opacity: 0; }
    20% { transform: translate(-50%, -50%) scale(1.4) rotate(10deg); opacity: 1; }
    40% { transform: translate(-50%, -50%) scale(1.1) rotate(-10deg); }
    60% { transform: translate(-50%, -50%) scale(1.3) rotate(10deg); opacity: 1; }
    80% { transform: translate(-50%, -50%) scale(1) translateY(-30px); opacity: 1; }
    100% { transform: translate(-50%, -50%) scale(0) translateY(-70px); opacity: 0; }
}

.pop-laugh {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 64px;
    pointer-events: none;
    z-index: 100;
    animation: laughPop 1s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    filter: drop-shadow(0 10px 25px rgba(0,0,0,0.5));
}

.tabs.reels-darkmode {
    background: rgba(10, 10, 10, 0.8) !important;
    backdrop-filter: blur(30px);
    -webkit-backdrop-filter: blur(30px);
    box-shadow: 0 -4px 30px rgba(0,0,0,0.6) !important;
    border-top: 1px solid rgba(255, 255, 255, 0.05);
}
.tabs.reels-darkmode .tab { color: rgba(255, 255, 255, 0.4); }
.tabs.reels-darkmode .tab.active { color: var(--text-primary); }

/* --- Chat Dropdown Menu Styles --- */
.chat-dropdown {
    position: absolute;
    top: 42px;
    right: 0;
    background: rgba(22, 22, 26, 0.95);
    border: 1px solid var(--border-color);
    backdrop-filter: blur(20px);
    border-radius: 12px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    z-index: 100;
    min-width: 140px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.6);
}

.chat-dropdown-item {
    padding: 12px 16px;
    font-size: 13px;
    font-weight: 600;
    color: var(--text-primary);
    cursor: pointer;
    transition: background 0.2s ease;
    white-space: nowrap;
}

.chat-dropdown-item:hover {
    background: rgba(255, 255, 255, 0.08);
}

.chat-dropdown-item.danger {
    color: #ef4444;
}

/* Custom Scrollbar for Chat */
#chatMessages::-webkit-scrollbar {
    width: 4px;
}

#chatMessages::-webkit-scrollbar-thumb {
    background: rgba(255, 255, 255, 0.2);
    border-radius: 4px;
}
</style>  
</head>  
<body>  
<div class="card">  
<div id="registerView" class="view-pane">  
    <h2>Create Profile</h2>  
    <input id="username" placeholder="Your Name">  
    <input id="userclass" placeholder="Class / Section">  
    <div class="select-wrapper">
        <select id="usergender">  
            <option disabled selected>Select Gender</option>  
            <option>Male</option>  
            <option>Female</option>  
        </select>  
    </div>
    <button onclick="saveProfile()">Create Profile</button>  
</div>  

<div id="confessionView" class="view-pane hidden">  
    <h2>Express Your Feelings ❤️</h2>  
    <div id="fomoTicker" class="fomo-ticker"></div>
    <textarea id="confessionMessage" placeholder="Write your secret confession here..."></textarea>  
    <button id="sendBtn" onclick="sendConfession()">Send Confession 🚀</button>  
    <p id="sendLabel" style="font-weight: 500; font-size: 13px; text-align: center; margin-top: 10px;"></p>
</div>  

<div id="profileView" class="view-pane hidden">  
    <h2>Your Profile</h2>  
    <p id="profileInfo"></p>  
    <button onclick="showEdit()">Edit Profile</button>  
    <hr style="border:0; border-top:1px solid var(--border-color); margin:24px 0;">
    <h3 style="color:var(--accent-solid); font-size:16px; margin:0 0 14px 0; font-weight: 600; text-align: left;">Your Uploads</h3>
    <div id="myConfessionsList"></div>
</div>  

<div id="editView" class="view-pane hidden">  
    <h2>Edit Profile</h2>  
    <input id="editName">  
    <input id="editClass">  
    <div class="select-wrapper">
        <select id="editGender">  
            <option>Male</option>  
            <option>Female</option>  
        </select>  
    </div>
    <button onclick="updateProfile()">Save Changes</button>  
</div>  

<div id="reelsView" class="view-pane hidden" style="padding:0 !important; overflow:hidden !important;">
    <div class="reels-container" id="reelsContainer"></div>
</div>

<div id="friendsView" class="view-pane hidden">
    <h2>Search Friends</h2>
    <input id="searchUserInp" placeholder="Enter name to look up..." oninput="searchUsers()">
    <div id="searchResults"></div>

    <h3 style="color: var(--accent-solid); font-size: 15px; margin: 20px 0 8px 0; font-weight:600;">Friend Requests</h3>
    <div id="friendRequestsList"></div>

    <h3 style="color: var(--accent-blue); font-size: 15px; margin: 20px 0 8px 0; font-weight:600;">Direct Messages</h3>
    <div id="friendsList"></div>
</div>

<div id="chatView" class="view-pane hidden" style="height:100%; display:flex; flex-direction:column; overflow:hidden;">
    <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:15px; border-bottom:1px solid var(--border-color); padding-bottom:10px; position:relative;">
        <div style="display:flex; align-items:center; gap:12px;">
            <button onclick="showTab('friends')" style="width:auto; padding:8px 14px; margin:0; background:rgba(255,255,255,0.08); border-radius:10px;">← Back</button>
            <h3 id="chatHeaderName" style="margin:0; font-size:16px; font-weight:700; color:var(--text-primary);">Chat</h3>
        </div>
        <!-- Three-dots Options Menu -->
        <div style="position:relative;">
            <button onclick="toggleChatMenu(event)" style="width:auto; margin:0; padding:6px 12px; background:rgba(255,255,255,0.08); border-radius:10px; font-size:18px; line-height:1; cursor:pointer;">⋮</button>
            <div id="chatMenuDropdown" class="chat-dropdown hidden">
                <div class="chat-dropdown-item" onclick="clearChat()">Clear Chat</div>
                <div class="chat-dropdown-item danger" onclick="deleteFriend()">Delete Friend</div>
            </div>
        </div>
    </div>
    
    <!-- Chat scrollable area -->
    <div id="chatMessages" style="flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:10px; padding-right:6px; min-height:0; scrollbar-width:thin;"></div>
    
    <div style="display:flex; gap:8px; align-items:center; margin-top:10px; padding-top:5px;">
        <input id="chatMessageInp" placeholder="Message..." style="margin:0;">
        <button onclick="sendDirectMessage()" style="width:auto; margin:0; padding:12px 16px; background:var(--accent-gradient);">Send</button>
    </div>
</div>

</div>  

<div class="tabs hidden" id="tabs">  
    <div class="tab" onclick="showTab('profile')">
        <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
        </svg>
        <span>You</span>
    </div>  
    <div class="tab active" onclick="showTab('confession')">
        <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
        <span>Confess</span>
    </div>  
    <div class="tab" onclick="showTab('reels')">
        <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="23 7 16 12 23 17 23 7"></polygon>
            <rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect>
        </svg>
        <span>Feeds</span>
</div>  
    <div class="tab" onclick="showTab('friends')">
        <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
            <circle cx="9" cy="7" r="4"></circle>
            <path d="M23 21v-2a4 4 0 0 1 0 7.75"></path>
        </svg>
        <span>Friends</span>
    </div>
</div>  

<script>  
const SUPABASE_URL="https://gsckseffapurzqkexeup.supabase.co";

// Upsert user profile to Supabase with Conflict resolution on 'username'
async function syncProfileToDB(name, uClass, gender) {
    if (!name || !uClass || !gender) return;
    if(!supabaseClient){  
        supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);  
    }
    const { error } = await supabaseClient.from('profiles').upsert([
        { username: name.trim(), class: uClass.trim(), gender: gender, updated_at: new Date() }
    ], { onConflict: 'username' });

    if (error) {
        console.error("Error syncing profile to database:", error.message);
    }
}
  
async function loadProfile(){  
    labelProfileInfo.innerText =  
    `Name: ${localStorage.getItem('sb_name')}  
Class: ${localStorage.getItem('sb_class')}

        .from('confessions')

async function deleteConfession(id, element) {
    if(!supabaseClient){  
        supabaseClient=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);  
    }  
    const { error } = await supabaseClient
        .from('confessions')
        .delete()
        .eq('id', id);

    if (error) {
        alert("Error deleting confession: " + error.message);
    } else {
        element.remove();
        const listContainer = document.getElementById('myConfessionsList');
        if (listContainer && listContainer.children.length === 0) {
            listContainer.innerHTML = "<p style='color:var(--text-secondary); text-align:center; font-size:13px; opacity:0.7;'>No confessions uploaded yet.</p>";
        }
    }
}

async function saveProfile(){  
    const uname = inputUsername.value.trim();
    const uclass = inputUserclass.value.trim();
    const ugender = selectUsergender.value;

    if(!uname || !uclass || selectUsergender.selectedIndex === 0){  
        alert("Fill all fields");  
        return;  
    }  

    if(!supabaseClient){  
        supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);  
    }

    // CHECK IF USERNAME IS ALREADY TAKEN
    const { data: existingUser } = await supabaseClient
        .from('profiles')
        .select('username')
        .eq('username', uname);

    if (existingUser && existingUser.length > 0) {
        alert(`The username "${uname}" is already taken! Please choose another name.`);
        return;
    }
  
    localStorage.setItem('sb_name', uname);  
    localStorage.setItem('sb_class', uclass);  
    localStorage.setItem('sb_gender', ugender);  
  
    await syncProfileToDB(uname, uclass, ugender);

    viewRegister.classList.add('hidden');  
    navigationTabs.classList.remove('hidden');  
    showTab('confession');  
}

async function updateProfile(){  
    const ename = inputEditName.value.trim();
    const eclass = inputEditClass.value.trim();
    const egender = selectEditGender.value;
    const oldName = localStorage.getItem('sb_name');

    if (!ename || !eclass) {
        alert("Please fill all fields.");
        return;
    }

    if(!supabaseClient){  
        supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);  
    }

    // CHECK IF NEW USERNAME IS ALREADY TAKEN BY SOMEONE ELSE
    if (ename !== oldName) {
        const { data: existingUser } = await supabaseClient
            .from('profiles')
            .select('username')
            .eq('username', ename);

        if (existingUser && existingUser.length > 0) {
            alert(`The username "${ename}" is already taken! Please choose another name.`);
            return;
        }

        // Delete old profile entry if username changed
        await supabaseClient.from('profiles').delete().eq('username', oldName);
    }

    localStorage.setItem('sb_name', ename);  
    localStorage.setItem('sb_class', eclass);  
    localStorage.setItem('sb_gender', egender);  
  
    await syncProfileToDB(ename, eclass, egender);

    viewEdit.classList.add('hidden');  
    viewProfile.classList.remove('hidden');  
    loadProfile();  
}

    const mainCard = document.querySelector('.card');

    if(tab==='profile'){

        document.querySelectorAll('.tab')[3].classList.add('active');
    }

async function sendConfession(){  
    const msg=txtConfessionMessage.value.trim();  
    const label=labelSendLabel;  
    const btn=document.getElementById("sendBtn");  
  
    const banned=["fuck","ass","randi","chod","chut","lund","gand","sex","bitch","slut"];  
  
    if(!msg){  
        alert("Type message");  
        return;  
    }  
  
    const lower=msg.toLowerCase();  
    for(let w of banned){  
        if(lower.includes(w)){  
            label.style.color="#ef4444";  
            label.innerText="Don't use abusive words.";  
            return;  
        }  
    }  
  
    label.style.color="#f59e0b";  
    label.innerText="Sending...";  
    btn.disabled=true;  
  
    if(!supabaseClient){  
        supabaseClient=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);  
    }  
  
    const {error}=await supabaseClient.from('confessions').insert([{  
        name:localStorage.getItem('sb_name'),  
        class:localStorage.getItem('sb_class'),  
        gender:localStorage.getItem('sb_gender'),  
        message:msg  
    }]);  
  
    btn.disabled=false;  
  
    if(error){  
        label.style.color="#ef4444";  
        label.innerText="Error sending message.";  
    } else {  
        label.style.color="#10b981";  
        label.innerText="Sent successfully ✨";  
        txtConfessionMessage.value="";  
    }  
}  

function updateFomoTicker() {
    const ticker = document.getElementById('fomoTicker');
    if (!ticker) return;

    ticker.classList.remove('visible');

    const currentHour = new Date().getHours();
    let min = 0, max = 0;

    if (currentHour >= 14 && currentHour < 20) { min = 9; max = 16; } 
    else if (currentHour >= 21 && currentHour < 22) { min = 3; max = 4; } 
    else if (currentHour >= 22 || currentHour < 8) { min = 0; max = 0; } 
    else if (currentHour >= 9 && currentHour < 13) { min = 5; max = 8; } 
    else {
        if (currentHour === 8 || currentHour === 20) { min = 3; max = 5; }
        else { min = 6; max = 8; }
    }

    const activeUsers = min === max ? min : Math.floor(Math.random() * (max - min + 1)) + min; 
    
    if (activeUsers === 0) return;

    ticker.innerHTML = `<span class="live-dot"></span> <b>${activeUsers} people online</b>`;
    
    setTimeout(() => {
        ticker.classList.add('visible');
    }, 150);
}

async function executeReelReaction(id, type, forceActive = false) {
    await toggleReaction(id, type, forceActive);

    const loveIds = getReactedIds('love');
    const fireIds = getReactedIds('fire');
    const laughIds = getReactedIds('laugh');

    const loveBtn = document.getElementById(`reel-love-btn-${id}`);
    const fireBtn = document.getElementById(`reel-fire-btn-${id}`);
    const laughBtn = document.getElementById(`reel-laugh-btn-${id}`);

    if(type === 'love' && loveBtn) {
        if (loveIds.includes(id)) {
            loveBtn.classList.add('liked');
        } else {
            loveBtn.classList.remove('liked');
        }
    }
    if(type === 'fire' && fireBtn) {
        if (fireIds.includes(id)) {
            fireBtn.classList.add('fired');
        } else {
            fireBtn.classList.remove('fired');
        }
    }
    if(type === 'laugh' && laughBtn) {
        if (laughIds.includes(id)) {
            loveBtn?.classList.remove('liked');
            laughBtn.classList.add('laughed');
            const slide = document.getElementById(`reel-slide-${id}`);
            showFloatingLaugh(slide);
        } else {
            laughBtn.classList.remove('laughed');
        }
    }
}

function getReactedIds(type) {
    let storageKey = type === 'love' ? 'sb_liked_confessions' : `sb_react_${type}`;
    try {
        return JSON.parse(localStorage.getItem(storageKey)) || [];
    } catch(e) {
        return [];
    }
}

async function toggleReaction(id, type, forceActive = false) {
    let storageKey = type === 'love' ? 'sb_liked_confessions' : `sb_react_${type}`;
    let dbColumn = type === 'love' ? 'likes' : (type === 'fire' ? 'react_fire' : 'react_laugh');
    
    let activeIds = getReactedIds(type);
    const countSpan = document.getElementById(`reel-${type}-count-${id}`);
    let currentCount = countSpan ? (parseInt(countSpan.innerText) || 0) : 0;
    
    let hasReacted = activeIds.includes(id);

    if (forceActive && hasReacted) {
        return; 
    }

    let newCount = currentCount;

    if (hasReacted) {
        activeIds = activeIds.filter(activeId => activeId !== id);
        newCount = Math.max(0, currentCount - 1);
    } else {
        activeIds.push(id);
        newCount = currentCount + 1;
    }

    localStorage.setItem(storageKey, JSON.stringify(activeIds));
    if(countSpan) countSpan.innerText = newCount;

    if(!supabaseClient){  
        supabaseClient=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);  
    }  

    let updateData = {};
    updateData[dbColumn] = newCount;

    await supabaseClient
        .from('confessions')
        .update(updateData)
        .eq('id', id);
}

async function searchUsers() {
    const searchInput = document.getElementById('searchUserInp');
    const query = searchInput.value.trim();
    const resultsContainer = document.getElementById('searchResults');
    const myName = localStorage.getItem('sb_name');
    
    if (query.length < 1) {
        resultsContainer.innerHTML = "";
        return;
    }
    
    if(!supabaseClient){ supabaseClient=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY); }
    
    // Search profiles
    const { data: profiles, error } = await supabaseClient
        .from('profiles')
        .select('*')
        .ilike('username', `%${query}%`);
        
    // Cancel rendering if user cleared or changed input while database fetch was in progress
    if (searchInput.value.trim().length < 1) {
        resultsContainer.innerHTML = "";
        return;
    }
    if (searchInput.value.trim() !== query) {
        return;
    }

    resultsContainer.innerHTML = "";
    if (error || !profiles || profiles.length === 0) {
        resultsContainer.innerHTML = "<p style='font-size:12px; color:var(--text-secondary); text-align:center;'>No matching users found.</p>";
        return;
    }

    // Filter duplicate usernames to prevent duplicates in search UI
    const uniqueProfiles = [];
    const seenUsernames = new Set();
    profiles.forEach(u => {
        const key = u.username ? u.username.trim().toLowerCase() : '';
        if (key && !seenUsernames.has(key)) {
            seenUsernames.add(key);
            uniqueProfiles.push(u);
        }
    });
    
    // Fetch all request relationships involving current user
    const { data: relations } = await supabaseClient
        .from('friend_requests')
        .select('*')
        .or(`sender.eq.${myName},receiver.eq.${myName}`);

    // Re-check input state in case user cleared text during secondary fetch
    if (searchInput.value.trim().length < 1) {
        resultsContainer.innerHTML = "";
        return;
    }

    const relMap = {};
    if (relations) {
        relations.forEach(r => {
            const other = r.sender === myName ? r.receiver : r.sender;
            // Prioritize accepted status over pending status
            if (!relMap[other] || r.status === 'accepted') {
                relMap[other] = r;
            }
        });
    }

    uniqueProfiles.forEach(user => {
        const row = document.createElement('div');
        row.className = 'confess-item';

        if (user.username === myName) {
            // Searching own ID displays user's own profile tagged with (You)
            row.innerHTML = `
                <div><b>${user.username}</b> <span style="font-size:11px; opacity:0.6;">(Class ${user.class})</span></div>
                <span style="font-size:12px; color:var(--text-secondary); background:rgba(255,255,255,0.08); padding:4px 10px; border-radius:8px;">You</span>
            `;
        } else {
            const rel = relMap[user.username];
            let actionHtml = '';

            if (!rel) {
                actionHtml = `<button onclick="sendFriendRequest('${user.username}')" style="width:auto; padding:6px 12px; font-size:12px; margin:0; background:var(--accent-blue);">Add</button>`;
            } else if (rel.status === 'accepted') {
                actionHtml = `<button onclick="openDirectMessages('${user.username}')" style="width:auto; padding:6px 12px; font-size:12px; margin:0; background:var(--accent-gradient);">Chat</button>`;
            } else if (rel.status === 'pending') {
                if (rel.sender === myName) {
                    actionHtml = `<span style="font-size:12px; color:#f59e0b; background:rgba(245, 158, 11, 0.15); padding:6px 10px; border-radius:8px; font-weight:600;">Pending</span>`;
                } else {
                    actionHtml = `<button onclick="processRequest(${rel.id}, 'accepted')" style="width:auto; padding:6px 10px; font-size:12px; margin:0; background:var(--accent-blue);">Accept</button>`;
                }
            }

            row.innerHTML = `
                <div><b>${user.username}</b> <span style="font-size:11px; opacity:0.6;">(Class ${user.class})</span></div>
                ${actionHtml}
            `;
        }
        resultsContainer.appendChild(row);
    });
}

async function sendFriendRequest(targetUser) {
    const myName = localStorage.getItem('sb_name');
    if(!supabaseClient){ supabaseClient=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY); }

    // Clear any previous stale requests between both users
    const { data: existing } = await supabaseClient
        .from('friend_requests')
        .select('*')
        .or(`sender.eq.${myName},receiver.eq.${myName}`);

    if (existing) {
        const stale = existing.filter(r => r.sender === targetUser || r.receiver === targetUser);
        for (let req of stale) {
            await supabaseClient.from('friend_requests').delete().eq('id', req.id);
        }
    }

    const { error } = await supabaseClient
        .from('friend_requests')
        .insert([{ sender: myName, receiver: targetUser, status: 'pending' }]);
        
    if (error) {
        alert("Request already pending or connection exists.");
    } else {
        alert(`Friend request sent to ${targetUser}!`);
        searchUsers(); // Refresh search UI instantly
    }
}

async function loadFriendsAndRequests() {
    const myName = localStorage.getItem('sb_name');
    if(!supabaseClient){ supabaseClient=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY); }

    // Fetch Inbound Pending Requests
    const { data: inbound } = await supabaseClient
        .from('friend_requests')
        .select('*')
        .eq('receiver', myName)
        .eq('status', 'pending');
        
    const reqList = document.getElementById('friendRequestsList');
    reqList.innerHTML = "";
    if (!inbound || inbound.length === 0) {
        reqList.innerHTML = "<p style='font-size:12px; color:var(--text-secondary); text-align:center;'>No pending friend requests.</p>";
    } else {
        inbound.forEach(req => {
            const row = document.createElement('div');
            row.className = 'confess-item';
            row.innerHTML = `
                <div><b>${req.sender}</b></div>
                <div style="display:flex; gap:6px;">
                    <button onclick="processRequest(${req.id}, 'accepted')" style="width:auto; padding:6px 10px; font-size:12px; margin:0; background:var(--accent-blue);">Accept</button>
                    <button onclick="processRequest(${req.id}, 'rejected')" style="width:auto; padding:6px 10px; font-size:12px; margin:0; background:#ef4444;">Reject</button>
                </div>
            `;
            reqList.appendChild(row);
        });
    }

    // Fetch Connections
    const { data: friends } = await supabaseClient
        .from('friend_requests')
        .select('*')
        .eq('status', 'accepted')
        .or(`sender.eq.${myName},receiver.eq.${myName}`);
        
    const friendsList = document.getElementById('friendsList');
    friendsList.innerHTML = "";
    if (!friends || friends.length === 0) {
        friendsList.innerHTML = "<p style='font-size:12px; color:var(--text-secondary); text-align:center;'>No friends yet. Find users above!</p>";
    } else {
        friends.forEach(f => {
            const buddy = f.sender === myName ? f.receiver : f.sender;
            const row = document.createElement('div');
            row.className = 'confess-item';
            row.style.cursor = "pointer";
            row.innerHTML = `
                <div><b>${buddy}</b> <span style="font-size:11px; color:var(--text-secondary); margin-left:8px;">• Send Message</span></div>
            `;
            row.onclick = () => openDirectMessages(buddy);
            friendsList.appendChild(row);
        });
    }
}

async function processRequest(id, resolution) {
    if(!supabaseClient){ supabaseClient=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY); }

    if (resolution === 'accepted') {
        await supabaseClient.from('friend_requests').update({ status: 'accepted' }).eq('id', id);
    } else {
        // Completely delete request from database so it's removed on both sender & receiver sides
        await supabaseClient.from('friend_requests').delete().eq('id', id);
    }
    loadFriendsAndRequests();
    searchUsers();
}

function openDirectMessages(friendName) {
    activeChatFriend = friendName;
    document.getElementById('chatHeaderName').innerText = friendName;
    
    // Clear previous chat messages instantly to prevent switching delay bleed
    const msgBox = document.getElementById('chatMessages');
    if (msgBox) msgBox.innerHTML = "";

    showTab('chat');
    streamMessages();
    if(chatInterval) clearInterval(chatInterval);
    chatInterval = setInterval(streamMessages, 2500);
}

async function streamMessages() {
    if (!activeChatFriend || document.getElementById('chatView').classList.contains('hidden')) return;
    
    const currentChatFriend = activeChatFriend;
    const myName = localStorage.getItem('sb_name');
    if(!supabaseClient){ supabaseClient=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY); }
    
    const { data } = await supabaseClient
        .from('messages')
        .select('*')
        .or(`and(sender.eq.${myName},receiver.eq.${activeChatFriend}),and(sender.eq.${activeChatFriend},receiver.eq.${myName})`)
        .order('created_at', { ascending: true });
        
    // Guarantee active friend has not changed while network request was pending
    if (activeChatFriend !== currentChatFriend) return;

    const msgBox = document.getElementById('chatMessages');
    msgBox.innerHTML = "";
    
    if (data) {
        data.forEach(msg => {
            const bubble = document.createElement('div');
            const sideMe = msg.sender === myName;
            bubble.style.alignSelf = sideMe ? 'flex-end' : 'flex-start';
            bubble.style.background = sideMe ? 'var(--accent-gradient)' : 'rgba(255,255,255,0.08)';
            bubble.style.padding = '10px 14px';
            bubble.style.borderRadius = sideMe ? '16px 16px 4px 16px' : '16px 16px 16px 4px';
            bubble.style.maxWidth = '75%';
            bubble.style.fontSize = '13px';
            bubble.style.wordBreak = 'break-word';
            bubble.innerText = msg.message;
            msgBox.appendChild(bubble);
        });
        msgBox.scrollTop = msgBox.scrollHeight;
    }
}

async function sendDirectMessage() {
    const input = document.getElementById('chatMessageInp');
    const content = input.value.trim();
    if (!content || !activeChatFriend) return;
    
    const myName = localStorage.getItem('sb_name');
    input.value = "";
    
    if(!supabaseClient){ supabaseClient=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY); }

    await supabaseClient
        .from('messages')
        .insert([{ sender: myName, receiver: activeChatFriend, message: content }]);
        
    streamMessages();
}

// Toggle Chat Options Dropdown Menu
function toggleChatMenu(e) {
    if (e) e.stopPropagation();
    const dropdown = document.getElementById('chatMenuDropdown');
    if (dropdown) dropdown.classList.toggle('hidden');
}

// Close dropdown when clicking outside
document.addEventListener('click', (e) => {
    const dropdown = document.getElementById('chatMenuDropdown');
    if (dropdown && !dropdown.classList.contains('hidden')) {
        dropdown.classList.add('hidden');
    }
});

// Option 1: Clear Chat (deletes only message records between both users)
async function clearChat() {
    if (!activeChatFriend) return;
    if (!confirm(`Are you sure you want to clear all messages with ${activeChatFriend}?`)) return;

    const myName = localStorage.getItem('sb_name');
    if(!supabaseClient){ supabaseClient=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY); }

    const { error } = await supabaseClient
        .from('messages')
        .delete()
        .or(`and(sender.eq.${myName},receiver.eq.${activeChatFriend}),and(sender.eq.${activeChatFriend},receiver.eq.${myName})`);

    if (error) {
        alert("Error clearing chat: " + error.message);
    } else {
        const msgBox = document.getElementById('chatMessages');
        if (msgBox) msgBox.innerHTML = "";
    }
}

// Option 2: Delete Friend (deletes messages AND friend request records for both sides)
async function deleteFriend() {
    if (!activeChatFriend) return;
    if (!confirm(`Are you sure you want to delete ${activeChatFriend}? All chats and friendship data will be permanently removed for both of you.`)) return;

    const myName = localStorage.getItem('sb_name');
    if(!supabaseClient){ supabaseClient=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY); }

    // Delete messages
    await supabaseClient
        .from('messages')
        .delete()
        .or(`and(sender.eq.${myName},receiver.eq.${activeChatFriend}),and(sender.eq.${activeChatFriend},receiver.eq.${myName})`);

    // Delete friendship / friend request entries
    await supabaseClient
        .from('friend_requests')
        .delete()
        .or(`and(sender.eq.${myName},receiver.eq.${activeChatFriend}),and(sender.eq.${activeChatFriend},receiver.eq.${myName})`);

    alert(`${activeChatFriend} removed from your friends.`);
    activeChatFriend = "";
    showTab('friends');
}
